openapi: 3.1.0
info:
  title: OpsDeck API
  version: 0.1.0
  description: Registry API (port 3001) and Incident API (port 3002).
servers:
  - url: http://localhost:3001
    description: registry-api
  - url: http://localhost:3002
    description: incident-api
paths:
  /services:
    get:
      summary: List services with latest check status
      parameters:
        - { name: environment, in: query, schema: { $ref: '#/components/schemas/Environment' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Service' } } } } }
    post:
      summary: Register a service
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ServiceInput' } } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Name already registered }
  /services/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Get a service, responses: { '200': { description: OK }, '404': { description: Not found } } }
    patch: { summary: Update a service, responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/ValidationError' }, '404': { description: Not found } } }
    delete: { summary: Delete a service, responses: { '204': { description: Deleted }, '404': { description: Not found } } }
  /services/{id}/checks:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Recent check history, responses: { '200': { description: OK } } }
  /services/{id}/diagnostics:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { summary: Enqueue an immediate check, responses: { '202': { description: Accepted }, '404': { description: Not found } } }
  /incidents:
    get:
      summary: List incidents
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, investigating, resolved] } }
      responses: { '200': { description: OK } }
  /incidents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: Incident with timeline, responses: { '200': { description: OK }, '404': { description: Not found } } }
    patch:
      summary: Update status, severity, assignee or root cause
      description: Resolving requires a root_cause (422 root_cause_required otherwise).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [open, investigating, resolved] }
                severity: { type: string, enum: [low, medium, high, critical] }
                assignee: { type: string }
                root_cause: { type: string, minLength: 10 }
                author: { type: string }
      responses: { '200': { description: OK }, '422': { description: Root cause required } }
  /incidents/{id}/notes:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { summary: Add a timeline note, responses: { '201': { description: Created } } }
  /metrics/summary:
    get: { summary: Open incidents, MTTR (30d), uptime (24h), responses: { '200': { description: OK } } }
components:
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    ValidationError: { description: Validation failed, content: { application/json: { schema: { type: object, properties: { error: { type: string }, details: { type: object } } } } } }
  schemas:
    Environment: { type: string, enum: [dev, staging, prod] }
    ServiceInput:
      type: object
      required: [name, url, owner]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        url: { type: string, format: uri }
        owner: { type: string }
        environment: { $ref: '#/components/schemas/Environment' }
        version: { type: string }
    Service:
      allOf:
        - $ref: '#/components/schemas/ServiceInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            last_status: { type: string, enum: [up, down], nullable: true }
            last_latency_ms: { type: integer, nullable: true }
            last_checked_at: { type: string, format: date-time, nullable: true }
