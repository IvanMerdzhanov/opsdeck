name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e-all-in-one:
    name: End-to-end smoke test (all-in-one build, what Render deploys)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: opsdeck, POSTGRES_PASSWORD: opsdeck, POSTGRES_DB: opsdeck }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opsdeck" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f deploy/all-in-one.Dockerfile -t opsdeck-aio .
      - name: Start
        run: |
          docker run -d --name aio --network host \
            -e DATABASE_URL=postgres://opsdeck:opsdeck@localhost:5432/opsdeck \
            -e REDIS_URL=redis://localhost:6379 \
            -e ADMIN_API_KEY=ci-admin-key -e CHECK_INTERVAL_MS=10000 opsdeck-aio
          for i in $(seq 1 60); do curl -sf localhost:10000/healthz && exit 0; sleep 1; done; exit 1
      - name: Smoke test
        run: bash scripts/smoke.sh
        env:
          REGISTRY: http://localhost:10000/api/registry
          INCIDENTS: http://localhost:10000/api/incidents
          CHAOS_URL: http://localhost:10000/api/demo/chaos
      - name: Logs on failure
        if: failure()
        run: docker logs aio

  publish:
    name: Build & push images
    needs: [e2e, e2e-all-in-one]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [registry-api, incident-api, monitor-worker, demo-target]
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
