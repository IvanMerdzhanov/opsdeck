# Render Blueprint: the free public demo. One web service, databases bundled in the image (ADR-0006).
services:
  - type: web
    name: opsdeck
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/demo-bundled.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_API_KEY
        generateValue: true   # copy it from the service's Environment tab into the dashboard's Admin box
      - key: CHECK_INTERVAL_MS
        value: "30000"
